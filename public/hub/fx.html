<title>USD/MNT Monitor</title>
<!--
  USD/MNT Monitor. Everything on this page is rendered by the script at the bottom from the JSON in
  <script type="application/json" id="fx-state">. To update the page on a later run: append a run object to runs[],
  extend series.*, forecasts[], index_history[], political_log[] and cash_premium_obs[], fill forecasts[].actual and
  track_record, then republish. No other markup needs to change.

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap">
<style>
/* Layout: one reading column; a headline ledger on top, charts in a two-up grid, tables full width. */
:root{
  --plane:#f5f6f3; --surface:#fcfcfb; --ink:#0e1412; --ink2:#4a514d; --muted:#7d847f;
  --grid:#e3e5df; --axis:#c3c8c2; --border:rgba(14,20,18,.13); --accent:#0d5a4b; --wash:rgba(13,90,75,.07);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cond:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --plane:#0e100f; --surface:#1a1a19; --ink:#f3f5f2; --ink2:#c1c6c1; --muted:#8a908b;
    --grid:#2b2e2c; --axis:#3b3f3c; --border:rgba(255,255,255,.12); --accent:#62c6ad; --wash:rgba(98,198,173,.09);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --plane:#0e100f; --surface:#1a1a19; --ink:#f3f5f2; --ink2:#c1c6c1; --muted:#8a908b;
  --grid:#2b2e2c; --axis:#3b3f3c; --border:rgba(255,255,255,.12); --accent:#62c6ad; --wash:rgba(98,198,173,.09);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--plane);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-inline:20px;padding-block:28px 56px;display:flex;flex-direction:column;gap:36px}
a{color:var(--accent);text-underline-offset:2px}
a:focus-visible,summary:focus-visible,svg:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--cond);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.005em}
h1{font-size:30px;line-height:1.1}
h2{font-size:21px;line-height:1.2;padding-bottom:8px;border-bottom:1px solid var(--axis)}
h3{font-size:16px;line-height:1.25}
p{margin:0}
.archived{border:1px solid var(--border);background:color-mix(in srgb,var(--warn) 14%,var(--surface));border-radius:6px;padding:8px 12px;font-size:13px;color:var(--ink2);margin:0 0 12px;max-width:90ch}
.eyebrow{font-family:var(--cond);font-weight:500;font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.sub{color:var(--ink2);font-size:13.5px}
.small{font-size:13px;color:var(--ink2)}
section{display:flex;flex-direction:column;gap:14px;min-width:0}

/* headline ledger */
.mast{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:8px 24px}
.ledger{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1.25fr) minmax(0,1fr);background:var(--surface);border:1px solid var(--border);border-radius:6px}
.ledger>div{padding:18px 20px;display:flex;flex-direction:column;gap:10px;min-width:0}
.ledger>div+div{border-left:1px solid var(--grid)}
@media (max-width:860px){.ledger{grid-template-columns:1fr}.ledger>div+div{border-left:0;border-top:1px solid var(--grid)}}
.hero{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.hero .num{font-size:60px;line-height:.95;font-weight:600;letter-spacing:-.02em}
.hero .of{color:var(--muted);font-size:17px}
.meter{position:relative;height:10px;display:flex;gap:2px;margin-top:4px}
.meter i{display:block;height:100%;border-radius:2px;opacity:.28}
.meter .mk{position:absolute;top:-5px;width:3px;height:20px;background:var(--ink);border-radius:2px;transform:translateX(-1.5px)}
.meterlab{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--cond);font-weight:600;font-size:13px;letter-spacing:.06em;padding:2px 9px 2px 7px;border:1px solid var(--border);border-radius:99px;white-space:nowrap;color:var(--ink)}
.dot{width:9px;height:9px;flex:none;display:inline-block}
.dot.g{background:var(--good);border-radius:50%}
.dot.a{background:var(--warn);clip-path:polygon(50% 0,100% 100%,0 100%)}
.dot.r{background:var(--crit)}
.dot.n{border:1.5px solid var(--muted);border-radius:50%}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 14px;font-size:13.5px}
.kv dt{color:var(--ink2)} .kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
dl{margin:0}
.pbar{display:flex;gap:2px;height:22px}
.pbar i{display:block;height:100%;min-width:4px}
.pbar i:first-child{border-radius:3px 0 0 3px}.pbar i:last-child{border-radius:0 3px 3px 0}
.plist{display:grid;grid-template-columns:auto 1fr auto;gap:5px 10px;align-items:center;font-size:13.5px}
.plist .k{width:14px;height:3px;border-radius:2px}
.plist b{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.big{font-size:26px;font-weight:600;line-height:1.1}

/* highlights */
.hl{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:0;max-width:86ch}
.hl li{padding:11px 0 11px 18px;border-top:1px solid var(--grid);position:relative}
.hl li:first-child{border-top:0;padding-top:2px}
.hl li::before{content:"";position:absolute;left:0;top:20px;width:8px;height:2px;background:var(--accent)}
.hl li:first-child::before{top:11px}

/* charts */
.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:16px 16px 12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.wide{grid-column:1/-1}
@media (max-width:780px){.charts{grid-template-columns:1fr}}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12.5px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend svg{flex:none}
.plot{position:relative;min-width:0}
.plot svg{display:block;width:100%;overflow:visible}
.plot text{font-family:var(--sans);font-size:11.5px;fill:var(--muted);font-variant-numeric:tabular-nums}
.plot text.lab{fill:var(--ink2);font-size:12px}
.plot text.lab b,.plot tspan.v{fill:var(--ink);font-weight:600}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--border);border-radius:5px;padding:7px 10px;font-size:12.5px;box-shadow:0 4px 14px rgba(0,0,0,.12);z-index:3;min-width:120px;max-width:240px}
.tip .t{color:var(--muted);margin-bottom:3px}
.tip .r{display:grid;grid-template-columns:14px auto 1fr;gap:7px;align-items:center}
.tip .r i{height:2.5px;border-radius:2px;display:block}
.tip .r b{font-variant-numeric:tabular-nums;font-weight:600}
.tip .r span{color:var(--ink2)}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:560px){.duo{grid-template-columns:1fr}}
.duo>div{display:flex;flex-direction:column;gap:6px;min-width:0}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--border);border-radius:6px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--grid)}
tr:last-child td{border-bottom:0}
th{font-family:var(--cond);font-weight:600;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);white-space:nowrap;border-bottom:1px solid var(--axis)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.nw{white-space:nowrap}
td .d{display:block;color:var(--ink2);font-size:12.5px;margin-top:3px;max-width:62ch}
td .th{display:block;color:var(--muted);font-size:12px;margin-top:3px}
td.src a{display:block;font-size:12.5px;margin-bottom:2px}
.sig{min-width:880px} .log{min-width:680px} .mon{min-width:900px} .scn{min-width:560px}
tr.em td{background:var(--wash)}
details{border:1px solid var(--border);border-radius:6px;background:var(--surface)}
details summary{cursor:pointer;padding:10px 14px;font-weight:500}
details .tw{border:0;border-top:1px solid var(--grid);border-radius:0 0 6px 6px}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;max-width:92ch}
.cols{columns:2 340px;column-gap:28px;margin:0;padding-left:18px}
.cols li{break-inside:avoid;margin-bottom:5px;font-size:13.5px}
.note{background:var(--wash);border-left:3px solid var(--accent);padding:12px 16px;border-radius:0 6px 6px 0;max-width:92ch;display:flex;flex-direction:column;gap:8px}
footer{color:var(--muted);font-size:12.5px}
@media (max-width:480px){.wrap{padding-inline:16px}.hero .num{font-size:52px}h1{font-size:26px}}
</style>

<main class="wrap" id="app"></main>

36"}],"politics":[{"id":"P1","name":"Fiscal","score":2,"reason":"All three listed triggers are present: a 2026 budget amendment that doubles the planned deficit to about MNT 2.0-2.2 trn, public-sector pay rises of up to 50% from November, and a 2027 budget adding MNT 2.9 trn of pensions and 2.6 trn of wages against dividends not yet received. Counterpoint: the headline deficit is about 2% of GDP.","name_mn":"\u0422\u04e9\u0441\u04e9\u0432"},{"id":"P2","name":"Government stability","score":1,"reason":"Repeated quorum failures, ruling-party infighting and an opposition dismissal motion in preparation (41 signatures reported on 2 Sep). No motion filed, no vote, no resignation.","name_mn":"\u0417\u0430\u0441\u0433\u0438\u0439\u043d \u0433\u0430\u0437\u0440\u044b\u043d \u0442\u043e\u0433\u0442\u0432\u043e\u0440\u0442\u043e\u0439 \u0431\u0430\u0439\u0434\u0430\u043b"},{"id":"P3","name":"Central bank","score":2,"reason":"Unscheduled MPC meeting on 12 Aug (rate +0.5pp to 12.5%) and, on 2 Oct, the Governor said the bank will act as regulator rather than player in the FX market, phase out compulsory sales of state-company FX to the bank, and hold reserves above USD 7 bn. This is an explicit shift in FX-regime language. No rule change yet.","name_mn":"\u0422\u04e9\u0432 \u0431\u0430\u043d\u043a"},{"id":"P4","name":"China","score":0,"reason":"Only a one-day holiday closure of three border ports on 25 Sep. Coal export volume Jan-Aug up about 51% YoY.","name_mn":"\u0425\u044f\u0442\u0430\u0434"},{"id":"P5","name":"Fuel and energy","score":2,"reason":"Fuel reserves fell from 17 days (5 Aug) to about 10-11 days (28-29 Sep) with purchase limits and queues; Russian border price raised from USD 705 to 800 per tonne in July; first diesel imports from China and Korea.","name_mn":"\u0428\u0430\u0442\u0430\u0445\u0443\u0443\u043d \u0431\u0430 \u044d\u0440\u0447\u0438\u043c \u0445\u04af\u0447"},{"id":"P6","name":"Mining and ratings","score":0,"reason":"Oyu Tolgoi shareholders' agreement amended (loan rate cut, dividends targeted from 2027); Fitch affirmed B+ stable on 19 Aug; IMF Article IV concluded 6 Aug. Residual: the 2027 budget counts on MNT 3 trn of Oyu Tolgoi dividends.","name_mn":"\u0423\u0443\u043b \u0443\u0443\u0440\u0445\u0430\u0439 \u0431\u0430 \u0437\u044d\u044d\u043b\u0436\u0438\u0445 \u0437\u044d\u0440\u044d\u0433\u043b\u044d\u043b"}],"highlights":["First run, so this is the baseline. Index 20 of 100 (GREEN): 9 of 44 points, 7 from politics and 2 from data signals. Probability of a regime break within 6 months is 15% (accelerated 12%, step 3%).","The central bank changed its own language on the FX regime. On 2 Oct the Governor said Mongolbank will be a regulator rather than a player in the FX market, will phase out compulsory sales of state-company FX to the bank, and will not let reserves fall below USD 7 bn. This follows an unscheduled rate rise to 12.5% on 12 Aug and IMF Board advice (6 Aug) to phase out the bank's role as structural FX provider.","External hard data are strong and explain the low index: reserves reached USD 8.90 bn in September, the highest in the 24-month series (+6.3% on the month, third straight rise), the Jan-Aug trade surplus is about USD 6.0 bn, LME copper is up 8.7% in three months, and August coal and copper concentrate export values are up 51% and 47% YoY.","Domestic pressure is building under a flat nominal rate: CPI 12.5% gives real appreciation of 9.0pp (red starts at 10), M2 growth is 24.7% (red starts at 25), a budget amendment in final reading would double the 2026 deficit and raise public pay by up to 50% vs 2025 from November, and fuel reserves are down to about 10 days.","Two blind spots limit this reading. Neither double-weighted market signal could be observed: the last Naiman Sharga quote found is from 16 Jun, and no per-auction data were retrievable. Separately, DCE coking coal fell 16% in September alone (1,729 to 1,449) after an August spike; the three-month change is still inside green."],"data_gaps":["Signal 11 (cash premium): n/a. No Naiman Sharga USD sell quote found after 16 Jun 2026. Scored 0.","Signal 12 (auction net sales, 4 weeks vs prior 4): n/a. Mongolbank's auction table is script-rendered and no 2026 per-auction press reports were found. Only monthly supply totals (Jun 304, Jul 309, Aug 249 USD mn) are available; no information on unmet demand. Scored 0.","Signal 13, sovereign spread leg: n/a. No dated spread or yield from three months ago. Scored on USD/CNY only.","Official rate for 30 Sep 2026: n/a. The mirrored Mongolbank series ends 27 Sep (3,595.56, same as Fri 25 Sep). The September month-end is left blank and should be backfilled next run.","September 2026 trade, CPI, M2 and deposit data: not yet published. Signals 3-6 and 8-10 use August data.","Monthly export and trade figures are differenced from cumulative first-release totals in Ministry of Economy bulletins; later revisions are not captured. 1212.mn and customs pages could not be fetched.","Official month-end rates come from a third-party mirror of Mongolbank's published daily series (GitHub ZorigoKH/tugrik), not from Mongolbank's own table, which is script-rendered. Cross-checks against Ministry of Economy month-end figures matched for Jun-Aug 2026; January 2026 differs (3,561 vs 3,564.08).","Reserves for Oct 2024-Aug 2026 are bulletin figures rounded to USD 1 mn. The August figure is 8,373 in the bulletin, 8.36 bn and 8.4 bn in two Governor statements.","January 2025 CPI (9.6%) is on the old base; a rebased figure was not retrieved.","Latest monthly budget execution from the Ministry of Finance: not retrieved. P1 rests on parliamentary and press reports.","Most pages were read through a summarising fetch tool rather than raw text; figures that drive scores were fetched twice where possible."],"sources":[["Mongolbank homepage (official rate, reserves, CPI, policy rate)","https://www.mongolbank.mn/mn/"],["Mongolbank Governor interview, 2 Oct 2026","https://www.mongolbank.mn/mn 6/rio-tinto-and-government-of-mongolia-agree-to-adjust-oyu-tolgoi-shareholder-loan-interest-rate"],["ikon.mn, Jan-Aug trade","https://ikon.mn/n/3q6n"],["ikon.mn, 2027 budget","https://ikon.mn/n/3qlc"],["Xinhua, fuel sales limits, 10 Aug 2026","https://english.news.cn/20260810/b2ecdd73029148a990f142ba126db2be/c.html"],["news.mn, Naiman Sharga quote, 17 Jun 2026","https://news.mn/r/2872689/"]],"highlights_mn":["\u0410\u043d\u0445\u043d\u044b \u0442\u0430\u0439\u043b\u0430\u043d \u0442\u0443\u043b \u044d\u043d\u044d \u043d\u044c \u0441\u0443\u0443\u0440\u044c \u04af\u0437\u04af\u04af\u043b\u044d\u043b\u0442. \u0418\u043d\u0434\u0435\u043a\u0441 100-\u0430\u0430\u0441 20 (\u041d\u041e\u0413\u041e\u041e\u041d): 44-\u04e9\u04e9\u0441 9 \u043e\u043d\u043e\u043e, \u04af\u04af\u043d\u044d\u044d\u0441 7 \u043d\u044c \u0443\u043b\u0441 \u0442\u04e9\u0440, 2 \u043d\u044c \u04e9\u0433\u04e9\u0433\u0434\u043b\u0438\u0439\u043d \u0434\u043e\u0445\u0438\u043e\u043d\u043e\u043e\u0441. \u0418\u0440\u044d\u0445 6 \u0441\u0430\u0440\u0434 \u0433\u043e\u0440\u0438\u043c \u0430\u043b\u0434\u0430\u0433\u0434\u0430\u0445 \u043c\u0430\u0433\u0430\u0434\u043b\u0430\u043b 15% (\u0445\u0443\u0440\u0434\u0430\u0441\u0441\u0430\u043d 12%, \u043e\u0433\u0446\u043e\u043c 3%).","\u0422\u04e9\u0432 \u0431\u0430\u043d\u043a \u0432\u0430\u043b\u044e\u0442\u044b\u043d \u0433\u043e\u0440\u0438\u043c\u044b\u043d \u0442\u0430\u043b\u0430\u0430\u0440\u0445 \u0445\u044d\u043b\u043b\u044d\u0433\u044d\u044d \u04e9\u04e9\u0440\u0447\u0438\u043b\u0441\u04e9\u043d. 10-\u0440 \u0441\u0430\u0440\u044b\u043d 2-\u043d\u0434 \u0415\u0440\u04e9\u043d\u0445\u0438\u0439\u043b\u04e9\u0433\u0447 \u041c\u043e\u043d\u0433\u043e\u043b\u0431\u0430\u043d\u043a \u0432\u0430\u043b\u044e\u0442\u044b\u043d \u0437\u0430\u0445 \u0437\u044d\u044d\u043b\u0434 \u043e\u0440\u043e\u043b\u0446\u043e\u0433\u0447 \u0431\u0443\u0441 \u0437\u043e\u0445\u0438\u0446\u0443\u0443\u043b\u0430\u0433\u0447 \u0431\u0430\u0439\u0445, \u0442\u04e9\u0440\u0438\u0439\u043d \u04e9\u043c\u0447\u0438\u0442 \u043a\u043e\u043c\u043f\u0430\u043d\u0438\u0443\u0434\u044b\u043d \u0432\u0430\u043b\u044e\u0442\u044b\u0433 \u0431\u0430\u043d\u043a\u0438\u043d\u0434 \u0430\u043b\u0431\u0430\u0434\u0430\u043d \u0445\u0443\u0434\u0430\u043b\u0434\u0430\u0445 \u0436\u0443\u0440\u043c\u044b\u0433 \u04af\u0435 \u0448\u0430\u0442\u0442\u0430\u0439 \u0445\u0430\u043b\u0430\u0445, \u043d\u04e9\u04e9\u0446\u0438\u0439\u0433 7 \u0442\u044d\u0440\u0431\u0443\u043c \u0430\u043c.\u0434\u043e\u043b\u043b\u0430\u0440\u0430\u0430\u0441 \u0434\u043e\u043e\u0448 \u0431\u0443\u0443\u0440\u0443\u0443\u043b\u0430\u0445\u0433\u04af\u0439 \u0433\u044d\u0436 \u043c\u044d\u0434\u044d\u0433\u0434\u0441\u044d\u043d. \u04ae\u04af\u043d\u0438\u0439 \u04e9\u043c\u043d\u04e9 8-\u0440 \u0441\u0430\u0440\u044b\u043d 12-\u043d\u0434 \u0442\u043e\u0432\u043b\u043e\u043b\u044b\u043d \u0431\u0443\u0441 \u0431\u043e\u0434\u043b\u043e\u0433\u044b\u043d \u0445\u04af\u04af\u0433 12.5% \u0431\u043e\u043b\u0433\u043e\u0436 \u04e9\u0441\u0433\u04e9\u0441\u04e9\u043d \u0431\u04e9\u0433\u04e9\u04e9\u0434 \u041e\u0423\u0412\u0421-\u0433\u0438\u0439\u043d \u0423\u0434\u0438\u0440\u0434\u0430\u0445 \u0437\u04e9\u0432\u043b\u04e9\u043b (8-\u0440 \u0441\u0430\u0440\u044b\u043d 6) \u0431\u0430\u043d\u043a\u043d\u044b \u0432\u0430\u043b\u044e\u0442 \u043d\u0438\u0439\u043b\u04af\u04af\u043b\u044d\u0433\u0447\u0438\u0439\u043d \u0431\u04af\u0442\u0446\u0438\u0439\u043d \u04af\u04af\u0440\u0433\u0438\u0439\u0433 \u04af\u0435 \u0448\u0430\u0442\u0442\u0430\u0439 \u0445\u0430\u043b\u0430\u0445\u044b\u0433 \u0437\u04e9\u0432\u043b\u04e9\u0441\u04e9\u043d.","\u0413\u0430\u0434\u0430\u0430\u0434 \u0441\u0430\u043b\u0431\u0430\u0440\u044b\u043d \u0442\u043e\u043e\u043d \u043c\u044d\u0434\u044d\u044d \u0445\u04af\u0447\u0442\u044d\u0439 \u043d\u044c \u0438\u043d\u0434\u0435\u043a\u0441 \u0431\u0430\u0433\u0430 \u0431\u0430\u0439\u0433\u0430\u0430\u0433 \u0442\u0430\u0439\u043b\u0431\u0430 ds and would weaken fiscal rules.","name_mn":"\u0422\u04e9\u0441\u04e9\u0432"},{"id":"P2","name":"Government stability","score":1,"reason":"Unchanged at 1. The opposition dismissal motion against the Prime Minister has still not been found filed, and the ruling party passed the budget amendment, which lowers near-term risk. No resignation.","name_mn":"\u0417\u0430\u0441\u0433\u0438\u0439\u043d \u0433\u0430\u0437\u0440\u044b\u043d \u0442\u043e\u0433\u0442\u0432\u043e\u0440\u0442\u043e\u0439 \u0431\u0430\u0439\u0434\u0430\u043b"},{"id":"P3","name":"Central bank","score":2,"reason":"Unchanged at 2. The Governor's 2 Oct statements (regulator rather than player in the FX market; end compulsory FX sales by state companies; reserves above USD 7 bn; no more unbacked money printing from 2027) are the regime-language shift. IMF staff (8 Oct) called for further monetary tightening and prompt passage of the central bank law. No scheduled MPC meeting in the window and no rule change yet.","name_mn":"\u0422\u04e9\u0432 \u0431\u0430\u043d\u043a"},{"id":"P4","name":"China","score":0,"reason":"0. The 1-7 Oct border closure was a scheduled holiday. China's September imports of Mongolian coking coal were weak (5.69 Mt), but no Chinese policy action against Mongolian coal was found.","name_mn":"\u0425\u044f\u0442\u0430\u0434"},{"id":"P5","name":"Fuel and energy","score":2,"reason":"Unchanged at 2. National fuel cover was about 11 days entering October; officials say queues ease only at 20 days. China halted fuel exports from 1 Oct, Russia's export ban runs to 31 Jan 2027 with intergovernmental deliveries exempt, and Korean and Chinese cargoes are small. Food inflation 20.8%.","name_mn":"\u0428\u0430\u0442\u0430\u0445\u0443\u0443\u043d \u0431\u0430 \u044d\u0440\u0447\u0438\u043c \u0445\u04af\u0447"},{"id":"P6","name":"Mining and ratings","score":0,"reason":"0. IMF staff visit (concluded 8 Oct) put reserves at USD 8.9 bn; its concerns are fiscal and are scored under P1. Mongolbank signed an MoU with the Bundesbank (21 Oct) and held talks with the PBoC Inner Mongolia branch on yuan financing (22 Oct).","name_mn":"\u0423\u0443\u043b \u0443\u0443\u0440\u0445\u0430\u0439 \u0431\u0430 \u0437\u044d\u044d\u043b\u0436\u0438\u0445 \u0437\u044d\u0440\u044d\u0433\u043b\u044d\u043b"}],"highlights":["Index up from 20 to 25 (still GREEN): 11 of 44 points, 7 from politics and 4 from data. The probability of a regime break within six months rises from 15% to 20% (accelerated 15%, step 5%). The official rate is 3,598.45 (22 Oct), still close to flat: +0.08% in three weeks.","Money growth jumped. Money supply rose 30.7% year on year in September (24.7% in August), crossing the red line. MNT 2.4 trillion was added in one month as the central bank bought dollars for reserves. That is tugrik pressure for 2027, not an immediate dollar shortage.","Inflation is rising, and fiscal policy is adding to it. CPI was 12.9% in September (food 20.8%). On 16 Oct parliament passed the 2026 amendment: deficit MNT 2.0 trn, pension and benefit rises from 1 Nov, and MNT 1.6 trn of state-company dividends. IMF staff (8 Oct) warned that the 2026 and 2027 budgets weaken fiscal rules and urged tighter monetary policy.","The external side is still strong. Reserves are USD 8.9 bn, the January-September trade surplus is USD 6.5 bn, and September copper and coal export values were up 58% and 17% year on year. Coal tonnage fell 13%, and coking coal futures are down 5.2% in three months, the first amber on a commodity signal.","The blind spots are unchanged: neither double-weighted market signal (cash premium, auction demand) could be observed. If both were red, the index would be 43 (AMBER)."],"data_gaps":["Signal 11 (cash premium): n/a. No Naiman Sharga USD sell quote found after 16 Jun 2026. Scored 0.","Signal 12 (auction net sales): n/a. Mongolbank's auction table is script-rendered and no per-auction reports were found. Scored 0.","Signal 13, sovereign spread leg: n/a. Scored on USD/CNY only.","Signal 10: the June deposit level was not re-read, so the change is shown against August; the share is falling either way.","Signal 8: the September bulletin labels the series 'money supply' rather than M2; it is read as the same series as the August M2 figure (54.4 trn).","October reserves, October CPI and October trade are not yet published.","Monthly export and trade figures are differenced from cumulative first-release totals in Ministry of Economy bulletins; later revisions are not captured.","The official rate comes from the Mongolbank homepage (22 Oct); the third-party mirror used earlier no longer returns current rows.","Coking coal futures read from Eastmoney daily data; Sina could not be reached this run.","Most pages were read through a summarising fetch tool; futures data were read directly."],"sources":[["Mongolbank homepage (official rate, reserves, CPI, policy rate)","https://www.mongolbank.mn/mn/"],["Mongolbank Governor interview, 2 Oct 2026","https://www.mongolbank.mn/mn/r/13122"],["Mongolbank MPC statement 2026/06, 17 Sep 2026","https://www.mongolbank.mn/en/r/13002"],["Mongolbank 2027 monetary policy guidelines release, 30 Sep 2026","https://www.mongolbank.mn/mn/r/13082"],["Mongolbank official daily USD/MNT, third-party mirror","https://raw.githubusercontent.com/ZorigoKH/tugrik/main/data/bom_usdmnt_daily.csv"],["Ministry of Economy and Development monthly macro bulletins (index)","https://med.gov.mn/monthlyreport"],["Ministry of Economy bulletin, August 2026","https://med.gov.mn/uploads/users/3962/files/M26-08MN.pdf"],["Trading Economics, Mongolia balance of trade (NSO)","https://tradingeconomics.com/mongolia/balance-of-trade"],["Trading Economics, Mongolia FX reserves","https://tradingeconomics.com/mongolia/foreign-exchange-reserves"],["Westmetall, LME copper cash settlement","https://www.westmetall.com/en/markdaten.php?action=table&field=LME_Cu_cash"],["Sina futures, DCE coking coal contracts","https://stock2.finance.sina.com.cn/futures/api/ 0\u0440\u0430\u0430 \u0433\u0443\u0440\u0432\u0430\u043d \u0441\u0430\u0440\u044b\u043d \u04e9\u043c\u043d\u04e9\u0445\u04e9\u04e9\u0441 3.8% \u0434\u043e\u043e\u0433\u0443\u0443\u0440 (\u0434\u0430\u0445\u0438\u043d \u043d\u043e\u0433\u043e\u043e\u043d; 10-\u0440 \u0441\u0430\u0440\u044b\u043d 22-\u043d\u0434 -5.2%), \u0437\u044d\u0441 4.9% \u04e9\u0441\u0441\u04e9\u043d.","\u041c\u04e9\u043d\u0433\u04e9\u043d\u0438\u0439 \u04e9\u0441\u04e9\u043b\u0442 (30.7%), \u0438\u043d\u0444\u043b\u044f\u0446 (12.9%), 10-\u0440 \u0441\u0430\u0440\u044b\u043d 16-\u043d\u0434 \u0431\u0430\u0442\u0430\u043b\u0441\u0430\u043d \u0442\u04e9\u0441\u0432\u0438\u0439\u043d \u0442\u044d\u043b\u044d\u043b\u0442 \u04e9\u04e9\u0440\u0447\u043b\u04e9\u0433\u0434\u04e9\u04e9\u0433\u04af\u0439; 10-\u0440 \u0441\u0430\u0440\u044b\u043d \u043c\u044d\u0434\u044d\u044d \u0445\u0430\u0440\u0430\u0430\u0445\u0430\u043d \u0433\u0430\u0440\u0430\u0430\u0433\u04af\u0439. \u0410\u043b\u0431\u0430\u043d \u0445\u0430\u043d\u0448 3,598.54 (10-\u0440 \u0441\u0430\u0440\u044b\u043d 24), \u0442\u043e\u0433\u0442\u0432\u043e\u0440\u0442\u043e\u0439 \u0445\u044d\u0432\u044d\u044d\u0440."],"shift_reason_mn":"\u0428\u0438\u043d\u0436\u044d\u044d\u0447\u0438\u0439\u043d \u0442\u043e\u0445\u0438\u0440\u0443\u0443\u043b\u0433\u0430 \u0445\u0438\u0439\u0433\u044d\u044d\u0433\u04af\u0439: \u0438\u043d\u0434\u0435\u043a\u0441 (32) 21-40-\u0438\u0439\u043d \u0437\u0443\u0440\u0432\u0430\u0441\u0442 \u0431\u0430\u0433\u0442\u0430\u0436 \u0431\u0430\u0439\u0433\u0430\u0430 \u0442\u0443\u043b 80/15/5 \u0445\u044d\u0440\u044d\u0433\u043b\u044d\u043d\u044d. \u0414\u0430\u0432\u0445\u0430\u0440 \u0436\u0438\u043d\u0442\u044d\u0439 \u0437\u0430\u0445 \u0437\u044d\u044d\u043b\u0438\u0439\u043d \u0445\u043e\u0451\u0440 \u0434\u043e\u0445\u0438\u043e \u0430\u043d\u0445 \u0443\u0434\u0430\u0430 \u0430\u0436\u0438\u0433\u043b\u0430\u0433\u0434\u0441\u0430\u043d: \u0434\u0443\u0443\u0434\u043b\u0430\u0433\u0430 \u0445\u0443\u0434\u 40\u044b\u043d \u043c\u044d\u0434\u044d\u044d\u043d\u0434 \u0446\u0443\u0432\u0430\u0430\u0433 M2 \u0431\u0443\u0441 '\u043c\u04e9\u043d\u0433\u04e9\u043d\u0438\u0439 \u043d\u0438\u0439\u043b\u04af\u04af\u043b\u044d\u043b\u0442' \u0433\u044d\u0436 \u043d\u044d\u0440\u043b\u044d\u0441\u044d\u043d; 8-\u0440 \u0441\u0430\u0440\u044b\u043d M2-\u0442\u044d\u0439 (54.4 \u0438\u0445 \u043d\u0430\u044f\u0434) \u0438\u0436\u0438\u043b \u0446\u0443\u0432\u0430\u0430 \u0433\u044d\u0436 \u04af\u0437\u044d\u0432.","10-\u0440 \u0441\u0430\u0440\u044b\u043d \u043d\u04e9\u04e9\u0446, \u0438\u043d\u0444\u043b\u044f\u0446, \u0433\u0430\u0434\u0430\u0430\u0434 \u0445\u0443\u0434\u0430\u043b\u0434\u0430\u0430\u043d\u044b \u043c\u044d\u0434\u044d\u044d \u0445\u0430\u0440\u0430\u0430\u0445\u0430\u043d \u043d\u0438\u0439\u0442\u043b\u044d\u0433\u0434\u044d\u044d\u0433\u04af\u0439.","\u0421\u0430\u0440\u044b\u043d \u044d\u043a\u0441\u043f\u043e\u0440\u0442, \u0445\u0443\u0434\u0430\u043b\u0434\u0430\u0430\u043d\u044b \u0442\u043e\u043e\u0433 \u042d\u0434\u0438\u0439\u043d \u0437\u0430\u0441\u0433\u0438\u0439\u043d \u044f\u0430\u043c\u043d\u044b \u043c\u044d\u0434\u044d\u044d\u043d\u0438\u0439 \u0430\u043d\u0445\u043d\u044b \u04e9\u0441\u0441\u04e9\u043d \u0434\u04af\u043d\u0433\u0438\u0439\u043d \u0437\u04e9\u0440\u04af\u04af\u0433\u044d\u044d\u0440 \u0442\u043e\u043e\u0446\u0441\u043e\u043d; \u0445\u043e\u0436\u043c\u044b\u043d \u0437\u0430\u0441\u0432\u0430\u0440\u044b\u0433 \u0442\u0443\u0441\u0433\u0430\u0430\u0433\u04af\u0439.","\u042d\u043d\u044d \u0442\u0430\u0439\u043b\u0430\u043d (10-\u0440 \u0441\u0430\u0440\u044b\u043d 24, \u0431\u044f\u043c\u0431\u0430) 10-\u0440 \u0441\u0430\u0440\u044b\u043d 23-\u043d\u044b \u0431\u0430\u0430\u0441\u0430\u043d \u0433\u0430\u0440\u0430\u0433\u0438\u0439\u043d \u0437\u0430\u0445 \u0437\u044d\u044d\u043b\u0438\u0439\u043d \u043c\u044d\u0434\u044d\u044d \u0431\u043e\u043b\u043e\u043d 10-\u0440 \u0441\u0430\u0440\u044b\u043d 24-\u043d\u0438\u0439 \u0430\u043b\u0431\u0430\u043d \u0445\u0430\u043d\u0448\u0438\u0439\u0433 \u043d\u044d\u043c\u044d\u0432. \u0421\u0430\u0440\u044b\u043d \u0441\u0442\u0430\u0442\u0438\u0441\u0442\u0438\u043a, \u043d\u04e9\u04e9\u0446, \u0443\u043b\u0441 \u0442\u04e9\u0440\u0438\u0439\u043d \u043c\u044d\u0434\u044d\u044d 10-\u0440 \u0441\u0430\u0440\u044b\u043d 23-\u043d\u0430\u0430\u0441 \u0445\u043e\u0439\u0448 \u0448\u0438\u043d\u044d\u044d\u0440 \u0433\u0430\u0440\u0430\u0430\u0433\u04af\u0439."]}]}</script>
